# Desired DNS state. Edit, open a PR, and the reconciler makes Route 53 match.
zone_id: Z0123456789EXAMPLE
zone_name: example.com.

# Only names equal to or under these are touched. NS and SOA never are.
managed_scope:
  - app.example.com.
  - api.example.com.

records:
  - name: app.example.com.
    type: A
    ttl: 300
    values: [192.0.2.10, 192.0.2.11]

  - name: www.app.example.com.
    type: CNAME
    ttl: 300
    values: [app.example.com.]

  - name: api.example.com.
    type: TXT
    ttl: 3600
    values: ['"owner=platform@example.com"']
